<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reviews and Comments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A3214F}a:hover{color:#7A1739}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.m-on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.m-on .fill{transform-origin:left;animation:fill 1s .3s cubic-bezier(.2,.8,.2,1) both}
.m-on .pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s!important}.d2{animation-delay:.16s!important}.d3{animation-delay:.24s!important}.d4{animation-delay:.32s!important}
.tap{transition:transform .18s ease}
.tap:active{transform:scale(.92)}
textarea::placeholder{color:#8A7180}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 1120px; box-sizing: border-box; background: #FFF7F2; font-family: Manrope, system-ui, sans-serif; color: #2B1622; padding: 20px; display: flex; flex-direction: column; gap: 18px">
  <div class="rise" style="display: flex; align-items: center; gap: 12px">
    <a href="Product.dc.html" aria-label="Back to product" class="tap" style="width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2B1622">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column"><span style="font-family: Marcellus, serif; font-size: 24px">Reviews</span><span style="font-size: 12px; color: #6E5563">Hand-woven cotton floor mat</span></div>
  </div>

  <div class="rise d1" style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; gap: 18px; align-items: center">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none">
      <span style="font-family: Marcellus, serif; font-size: 40px; line-height: 1">[4.8]</span>
      <span style="font-size: 12px; color: #6E5563">[N] reviews</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #6E5563">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px">{{b.star}}</span><span style="flex: 1; height: 7px; border-radius: 4px; background: #F3E8EC; overflow: hidden"><span class="fill" style="display: block; height: 100%; width: {{b.w}}; background: #E9A23B; border-radius: 4px"></span></span></div>
      </sc-for>
    </div>
  </div>

  <div class="rise d2" style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-weight: 700; font-size: 15px">Write a review</div>
    <div style="display: flex; gap: 4px" role="radiogroup" aria-label="Your rating">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <button type="button" aria-label="{{s.label}}" onClick="{{s.pick}}" class="tap" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; cursor: pointer; color: #E9A23B">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
        </button>
      </sc-for>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="position: absolute; left: -9999px">Your review</span>
      <textarea rows="3" placeholder="How did you like it? Fabric, finish, delivery…" value="{{draft}}" onChange="{{setDraft}}" style="border: 1.5px solid #EADCE2; border-radius: 16px; background: #FFF7F2; padding: 12px; font: inherit; font-size: 14px; color: #2B1622; resize: none"></textarea>
    </label>
    <div style="display: flex; gap: 10px">
      <button type="button" class="tap" style="height: 46px; padding: 0 16px; border-radius: 23px; border: 1.5px dashed #C9B3BD; background: transparent; font: inherit; font-weight: 600; font-size: 14px; color: #5A4250; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="12" cy="12" r="3.5"></circle></svg>Add photo</button>
      <button type="button" onClick="{{post}}" class="tap" style="flex: 1; height: 46px; border: none; border-radius: 23px; background: {{accent}}; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Post review</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{reviews}}" as="r" hint-placeholder-count="2">
      <div class="{{r.anim}}" style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 38px; height: 38px; border-radius: 19px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #2B1622">{{r.initial}}</span>
          <span style="display: flex; flex-direction: column; flex: 1"><span style="font-weight: 700; font-size: 14px">{{r.name}}</span><span style="font-size: 12px; color: #6E5563">{{r.meta}}</span></span>
          <span style="font-size: 13px; font-weight: 700; color: #9A5B0C; background: #FDEFD8; border-radius: 10px; padding: 4px 8px">★ {{r.rating}}</span>
        </div>
        <div style="font-size: 14px; line-height: 1.5; color: #3E2A35">{{r.text}}</div>
        <sc-if value="{{r.hasReply}}" hint-placeholder-val="{{ true }}">
          <div style="margin-left: 14px; padding: 10px 12px; border-radius: 14px; background: #FFF7F2; font-size: 13px; line-height: 1.45"><b style="color: {{accent}}">Shrungar replied</b><br>{{r.reply}}</div>
        </sc-if>
        <div style="display: flex; gap: 6px; font-size: 13px; color: #6E5563">
          <button type="button" onClick="{{r.like}}" class="tap" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #F7EEF1; font: inherit; font-weight: 600; color: #5A4250; cursor: pointer">♥ Helpful {{r.likes}}</button>
          <button type="button" class="tap" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #F7EEF1; font: inherit; font-weight: 600; color: #5A4250; cursor: pointer">Comment</button>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A3214F","options":["#A3214F","#2E5E4E","#7A3E9D","#B4441C"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      rating: 0,
      draft: '',
      likes: [0, 0],
      reviews: [
        { name: '[Customer name]', initial: 'C', meta: 'Verified buyer · [City]', rating: 5, text: '[Sample review: comment on colours, weave and delivery time.]', reply: '[Thank-you reply from the shop.]', tint: '#F6C9D6' },
        { name: '[Customer name]', initial: 'C', meta: 'Verified buyer · [City]', rating: 4, text: '[Sample review: comment on size, feel and packaging.]', reply: '', tint: '#DDEBE5' }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const labels = ['1 star', '2 stars', '3 stars', '4 stars', '5 stars'];
    return {
      accent: this.props.accent ?? '#A3214F',
      motionClass: (this.props.motion ?? true) ? 'm-on' : 'm-off',
      bars: [['5', '78%'], ['4', '15%'], ['3', '5%'], ['2', '1%'], ['1', '1%']].map(([star, w]) => ({ star, w })),
      stars: labels.map((label, i) => ({
        label,
        fill: i < s.rating ? 'currentColor' : 'none',
        pick: () => this.setState({ rating: i + 1 })
      })),
      draft: s.draft,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      post: () => {
        if (!s.draft.trim()) return;
        this.setState({
          reviews: [{ name: 'You', initial: 'Y', meta: 'Just now', rating: s.rating || 5, text: s.draft, reply: '', tint: '#FDEFD8', fresh: true }, ...s.reviews],
          likes: [0, ...s.likes],
          draft: '',
          rating: 0
        });
      },
      reviews: s.reviews.map((r, i) => ({
        ...r,
        anim: r.fresh ? 'pop' : 'rise d' + Math.min(i + 3, 4),
        hasReply: !!r.reply,
        likes: s.likes[i] || '',
        like: () => { const l = s.likes.slice(); l[i] = (l[i] || 0) + 1; this.setState({ likes: l }); }
      }))
    };
  }
}
</script>
</body>
</html>

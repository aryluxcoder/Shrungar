<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A3214F}a:hover{color:#7A1739}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bloom{0%{transform:scale(.4) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.m-on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.m-on .pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.m-on .bloom{animation:bloom 1.1s cubic-bezier(.2,.8,.2,1) both}
.m-on .spin{animation:spin 30s linear infinite}
.d1{animation-delay:.08s!important}.d2{animation-delay:.16s!important}.d3{animation-delay:.24s!important}.d4{animation-delay:.32s!important}.d5{animation-delay:.4s!important}
.tap{transition:transform .18s ease}
.tap:active{transform:scale(.96)}
input::placeholder{color:#8A7180}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7F2; font-family: Manrope, system-ui, sans-serif; color: #2B1622; position: relative; overflow: hidden">
  <div style="height: 330px; background: {{accent}}; border-radius: 0 0 40px 40px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #FFFFFF">
    <div class="bloom" style="position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px 0 0 -150px">
      <svg class="spin" width="300" height="300" viewBox="0 0 200 200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2">
        <circle cx="100" cy="100" r="92"></circle><circle cx="100" cy="100" r="70"></circle>
        <path d="M100 8c12 30 12 60 0 92-12-32-12-62 0-92zM100 192c-12-30-12-60 0-92 12 32 12 62 0 92zM8 100c30-12 60-12 92 0-32 12-62 12-92 0zM192 100c-30 12-60 12-92 0 32-12 62-12 92 0z"></path>
        <path d="M35 35c28 6 51 29 65 65-36-14-59-37-65-65zM165 165c-28-6-51-29-65-65 36 14 59 37 65 65zM165 35c-6 28-29 51-65 65 14-36 37-59 65-65zM35 165c6-28 29-51 65-65-14 36-37 59-65 65z"></path>
      </svg>
    </div>
    <div class="rise d1" style="font-family: Marcellus, serif; font-size: 44px; position: relative">Shrungar</div>
    <div class="rise d2" style="font-size: 14px; color: #FCD9A4; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; position: relative">Handmade · Made for you</div>
  </div>

  <sc-if value="{{signedOut}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 28px 22px; display: flex; flex-direction: column; gap: 14px">
      <div class="rise d2" style="font-family: Marcellus, serif; font-size: 26px">Welcome</div>
      <div class="rise d2" style="font-size: 14px; color: #5A4250; line-height: 1.5">Sign in to save your bag, track orders, write reviews and send private requests.</div>

      <button type="button" onClick="{{google}}" class="tap rise d3" style="height: 56px; border-radius: 28px; border: 1.5px solid #E2D4DA; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 16px; color: #2B1622; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(43,22,34,0.06)">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"></path><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"></path><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"></path><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" fill="#EA4335"></path></svg>
        Continue with Google</button>

      <div class="rise d4" style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #8A7180"><span style="flex: 1; height: 1px; background: #EADCE2"></span>or use your phone<span style="flex: 1; height: 1px; background: #EADCE2"></span></div>

      <label class="rise d4" style="display: flex; align-items: center; gap: 10px; height: 54px; border-radius: 18px; background: #FFFFFF; padding: 0 16px; box-shadow: 0 2px 10px rgba(43,22,34,0.05)">
        <span style="font-weight: 700; color: #5A4250">+91</span>
        <input type="tel" placeholder="Mobile number" aria-label="Mobile number" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #2B1622">
      </label>
      <button type="button" onClick="{{google}}" class="tap rise d5" style="height: 54px; border: none; border-radius: 27px; background: #2B1622; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer">Send OTP</button>

      <a href="Main.dc.html" class="rise d5" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Browse as guest</a>
    </div>
  </sc-if>

  <sc-if value="{{signedIn}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 0 22px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center">
      <span class="pop" style="margin-top: -44px; width: 88px; height: 88px; border-radius: 44px; background: #F6C9D6; border: 4px solid #FFF7F2; display: flex; align-items: center; justify-content: center; font-family: Marcellus, serif; font-size: 34px; color: #7A1739; position: relative">A</span>
      <div class="rise d1" style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-family: Marcellus, serif; font-size: 26px">Hello, [Name]</div>
        <div style="font-size: 13px; color: #6E5563">Signed in with [name]@gmail.com</div>
      </div>
      <div class="rise d2" style="width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left">
        <a href="Track.dc.html" class="tap" style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; text-decoration: none; color: #2B1622; font-weight: 700">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg>
          <span style="flex: 1">My orders &amp; requests</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
        <a href="Reviews.dc.html" class="tap" style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; text-decoration: none; color: #2B1622; font-weight: 700">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
          <span style="flex: 1">My reviews</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
        <a href="Help.dc.html" class="tap" style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; text-decoration: none; color: #2B1622; font-weight: 700">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>
          <span style="flex: 1">Help &amp; chat</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
        <div style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; font-weight: 700">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <span style="flex: 1">Saved addresses</span>
          <span style="font-size: 13px; color: #6E5563; font-weight: 500">[N]</span></div>
      </div>
      <button type="button" onClick="{{signOut}}" class="rise d3" style="height: 44px; border: none; background: transparent; font: inherit; font-weight: 600; color: {{accent}}; cursor: pointer">Sign out</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A3214F","options":["#A3214F","#2E5E4E","#7A3E9D","#B4441C"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { signedIn: false };
  }
  renderVals() {
    return {
      accent: this.props.accent ?? '#A3214F',
      motionClass: (this.props.motion ?? true) ? 'm-on' : 'm-off',
      signedIn: this.state.signedIn,
      signedOut: !this.state.signedIn,
      google: () => this.setState({ signedIn: true }),
      signOut: () => this.setState({ signedIn: false })
    };
  }
}
</script>
</body>
</html>

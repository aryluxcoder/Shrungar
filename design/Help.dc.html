<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Help and Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A3214F}a:hover{color:#7A1739}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes bubbleL{from{opacity:0;transform:translateX(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bubbleR{from{opacity:0;transform:translateX(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(26,127,69,.4)}50%{box-shadow:0 0 0 12px rgba(26,127,69,0)}}
.m-on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.m-on .bl{animation:bubbleL .45s cubic-bezier(.2,.8,.2,1) both}
.m-on .br{animation:bubbleR .45s cubic-bezier(.2,.8,.2,1) both}
.m-on .dt{animation:dot 1.2s infinite}
.m-on .ring{animation:ring 2.2s ease-in-out infinite}
.d1{animation-delay:.08s!important}.d2{animation-delay:.16s!important}.d3{animation-delay:.24s!important}
.dt2{animation-delay:.15s!important}.dt3{animation-delay:.3s!important}
.tap{transition:transform .18s ease}
.tap:active{transform:scale(.95)}
input::placeholder{color:#8A7180}
</style>
</helmet>
<div class="{{motionClass}}" style="width: 390px; height: 1000px; box-sizing: border-box; background: #FFF7F2; font-family: Manrope, system-ui, sans-serif; color: #2B1622; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 14px">
    <div class="rise" style="display: flex; align-items: center; gap: 12px">
      <a href="Main.dc.html" aria-label="Back" class="tap" style="width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2B1622">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; flex: 1"><span style="font-family: Marcellus, serif; font-size: 24px">Help &amp; chat</span><span style="font-size: 12px; color: #2E5E4E; font-weight: 700">● Shop team online · [HOURS]</span></div>
    </div>

    <a href="https://wa.me/91XXXXXXXXXX?text=Hi%20Shrungar%2C%20I%20have%20an%20enquiry%20about%20a%20bulk%20order" class="tap rise d1" style="display: flex; align-items: center; gap: 14px; text-decoration: none; background: #1A7F45; color: #FFFFFF; border-radius: 22px; padding: 16px">
      <span class="ring" style="flex: none; width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.6-2-1-1 1c-1-.5-1.9-1.4-2.4-2.4l1-1-1-2z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px; flex: 1"><span style="font-weight: 700; font-size: 16px">Chat on WhatsApp</span><span style="font-size: 13px; color: #D6F0E1">Enquiries, bulk &amp; big orders, gifting, custom work</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
    </a>

    <div class="rise d2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="tel:+91XXXXXXXXXX" class="tap" style="height: 50px; border-radius: 16px; background: #FFFFFF; text-decoration: none; color: #2B1622; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Call shop</a>
      <a href="https://maps.app.goo.gl/LLK6xsNwBBf3t9rn7" class="tap" style="height: 50px; border-radius: 16px; background: #FFFFFF; text-decoration: none; color: #2B1622; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Visit shop</a>
    </div>
    <div class="rise d3" style="font-size: 12px; line-height: 1.45; color: #6E5563; text-align: center">Shop No. 20, Plot No. 52, Sector 9, Khanda Colony (West), New Panvel East, Panvel 410206</div>
  </div>

  <div style="flex: 1; background: #FFFFFF; border-radius: 30px 30px 0 0; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
    <div style="font-size: 12px; color: #8A7180; text-align: center">In-app chat · replies from our shop</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
        <div class="{{m.cls}}" style="align-self: {{m.side}}; max-width: 78%; padding: 11px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 14px; line-height: 1.45">{{m.text}}</div>
      </sc-for>
      <sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
        <div class="bl" style="align-self: flex-start; padding: 12px 14px; border-radius: 18px 18px 18px 6px; background: #F7EEF1; display: flex; gap: 4px">
          <span class="dt" style="width: 7px; height: 7px; border-radius: 4px; background: #8A7180"></span><span class="dt dt2" style="width: 7px; height: 7px; border-radius: 4px; background: #8A7180"></span><span class="dt dt3" style="width: 7px; height: 7px; border-radius: 4px; background: #8A7180"></span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <button type="button" onClick="{{q.send}}" class="tap" style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #EADCE2; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #2B1622; cursor: pointer">{{q.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px; align-items: center; padding: 8px 0 20px">
      <label style="flex: 1; display: flex; align-items: center; height: 50px; border-radius: 25px; background: #FFF7F2; padding: 0 16px">
        <span style="position: absolute; left: -9999px">Message</span>
        <input type="text" placeholder="Type a message…" value="{{draft}}" onChange="{{setDraft}}" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: #2B1622">
      </label>
      <button type="button" aria-label="Send message" onClick="{{sendDraft}}" class="tap" style="width: 50px; height: 50px; border-radius: 25px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A3214F","options":["#A3214F","#2E5E4E","#7A3E9D","#B4441C"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      typing: false,
      msgs: [{ me: false, text: 'Namaste! How can we help you today?' }]
    };
    this.answers = {
      'Track my order': 'Your latest order is on its way. You can follow each step under Orders.',
      'Bulk / big order': 'Lovely! For big or bulk orders please tap "Chat on WhatsApp" above and we will share a quote.',
      'Size help': 'Tell us your usual size and we will suggest the best fit. You can also try at our shop.',
      'Returns': 'Handmade items can be exchanged within [X] days if unused. We will arrange pickup.'
    };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  say(text) {
    const reply = this.answers[text] || 'Thank you! Our shop team will reply here shortly.';
    this.setState({ msgs: [...this.state.msgs, { me: true, text }], typing: true, draft: '' });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ typing: false, msgs: [...this.state.msgs, { me: false, text: reply }] }), 1100);
  }
  renderVals() {
    const accent = this.props.accent ?? '#A3214F';
    const s = this.state;
    return {
      accent,
      motionClass: (this.props.motion ?? true) ? 'm-on' : 'm-off',
      msgs: s.msgs.map((m) => ({
        text: m.text,
        cls: m.me ? 'br' : 'bl',
        side: m.me ? 'flex-end' : 'flex-start',
        bg: m.me ? accent : '#F7EEF1',
        fg: m.me ? '#FFFFFF' : '#2B1622',
        radius: m.me ? '18px 18px 6px 18px' : '18px 18px 18px 6px'
      })),
      typing: s.typing,
      quick: Object.keys(this.answers).map((label) => ({ label, send: () => this.say(label) })),
      draft: s.draft,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      sendDraft: () => { if (s.draft.trim()) this.say(s.draft.trim()); }
    };
  }
}
</script>
</body>
</html>
